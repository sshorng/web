<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學思達AI作文助教 (講義整合版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        .feedback-card {
            transition: all 0.3s ease-in-out;
            border-left-width: 4px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .pulse {
            animation: pulse-animation 2s infinite;
        }
        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            100% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
        }
        .fade-in {
            animation: fadeInAnimation 0.5s ease-in-out;
        }
        @keyframes fadeInAnimation {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 0.75rem;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .dark .modal-content {
            background: #1e293b; /* slate-800 */
        }
        .typing-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: currentColor;
            margin: 0 2px;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-slate-900 dark:text-slate-300">

    <div class="container mx-auto p-4 md:p-8 max-w-4xl">
        
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-blue-600 dark:text-blue-400">學思達 AI 作文助教</h1>
            <p class="mt-2 text-lg text-gray-600 dark:text-slate-400">我是你的專屬助教，請選擇課堂講義，讓我陪你一起練習！</p>
        </header>

        <main id="app-container">

            <div class="mb-6 bg-white dark:bg-slate-800 p-6 rounded-xl shadow-lg fade-in">
                <label for="lesson-selector" class="block text-xl font-bold text-gray-900 dark:text-white mb-2">第一步：選擇講義課次</label>
                <p class="text-sm text-gray-600 dark:text-slate-400 mb-3">選擇你正在學習的課程，AI助教將會提供專屬的引導與批改。</p>
                <select id="lesson-selector" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 dark:bg-slate-700 dark:border-slate-600 dark:text-white">

                    <optgroup label="講義(上): 傳統型寫作">

                        <option value="lesson3">第三堂: 立意模組-立意三層次</option>
                        <option value="lesson4">第四堂: 結構模組-五段式結構</option>
                        <option value="lesson6">第六堂: 情境開頭法</option>
                        <option value="lesson7">第七堂: 豹尾之勁-首尾呼應</option>
                        <option value="lesson8">第八堂: 文字的顯微鏡-細節描寫</option>
                        <option value="lesson9">第九堂: 文字的化妝術-修辭三寶</option>
                        <option value="lesson10">第十堂: 沙盤推演-我想開設一家這樣的店</option>

                        <option value="lesson14">第十四堂: 情報分析學(上)-圖表與圖像</option>
                        <option value="lesson16">第十六堂: 核心寫作-倉鼠題</option>
                        <option value="lesson17">第十七堂: 情報分析學(下)-倫理思辨</option>
                        <option value="lesson18">第十八堂: 終極試煉-罹癌少女題</option>
                    </optgroup>
                </select>
            </div>
            
            <div id="guidance-section" class="hidden mb-6 bg-yellow-50 dark:bg-yellow-900/40 border-l-4 border-yellow-400 dark:border-yellow-500 p-5 rounded-lg shadow-md fade-in">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-xl font-bold text-yellow-800 dark:text-yellow-300">⭐ 課前引導</h3>
                    <button id="brainstorm-btn" class="flex items-center space-x-1.5 text-sm bg-yellow-200 text-yellow-800 dark:bg-yellow-900/80 dark:text-yellow-200 font-semibold py-1.5 px-3 rounded-lg hover:bg-yellow-300 dark:hover:bg-yellow-800/80 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" />
                        </svg>
                        <span>沒有靈感？問問助教</span>
                    </button>
                </div>
                <div id="guidance-content" class="text-yellow-700 dark:text-yellow-200"></div>
            </div>

            <div id="input-section" class="bg-white dark:bg-slate-800 p-6 sm:p-8 rounded-xl shadow-lg fade-in">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold text-gray-900 dark:text-white">第二步：輸入你的作文</h2>
                    <button id="voice-input-btn" class="flex items-center space-x-2 text-sm bg-cyan-100 text-cyan-700 dark:bg-cyan-900/60 dark:text-cyan-300 font-semibold py-2 px-3 rounded-lg hover:bg-cyan-200 dark:hover:bg-cyan-900/80 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg id="mic-icon" class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m12 7.5v-1.5a6 6 0 0 0-6-6v0a6 6 0 0 0-6 6v1.5m12 0v-1.5a6 6 0 0 0-6-6m0 0v-1.5m0 1.5v-1.5m0 0v-1.5m0 0a3 3 0 0 0-3 3v1.5m3-4.5v-1.5m0 0a3 3 0 0 0 3 3v1.5m-3-4.5v-1.5" /></svg>

                <!-- Topic Input Area -->
                <div class="mb-4">

                    <div class="mt-1 relative rounded-md shadow-sm">

                </div>

                <!-- Text Input Area -->
                <div>
                    <div class="relative">
                        <textarea id="essay-input" rows="18" class="w-full p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out resize-none bg-slate-50 text-gray-800 dark:bg-slate-700 dark:text-slate-200 dark:placeholder-slate-400" placeholder="點擊右上方「語音輸入」開始口述，或直接在此打字..."></textarea>
                        <div id="word-count" class="absolute bottom-3 right-3 text-sm text-gray-500 dark:text-slate-400">0 字</div>
                    </div>
                </div>

                <div class="mt-6 flex items-center space-x-4">
                    <button id="submit-btn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-300 ease-in-out flex items-center justify-center disabled:bg-gray-400">
                        <span id="btn-text">開始批改</span>
                        <div id="btn-loader" class="loader w-6 h-6 border-t-white hidden"></div>
                    </button>
                    <button id="show-feedback-btn" class="w-full bg-gray-200 dark:bg-slate-700 text-gray-700 dark:text-slate-200 font-bold py-3 px-4 rounded-lg hover:bg-gray-300 dark:hover:bg-slate-600 hidden">查看批改結果</button>
                </div>
                <p id="submit-error-message" class="text-red-500 text-center mt-4 text-sm hidden"></p>
            </div>

            <!-- Feedback Section (Initially hidden) -->
            <div id="feedback-section" class="hidden"></div>
        </main>
    </div>

    <script>
        // --- DOM Elements ---
        const essayInput = document.getElementById('essay-input');
        const topicInput = document.getElementById('topic-input');
        const wordCount = document.getElementById('word-count');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnLoader = document.getElementById('btn-loader');

        const micIcon = document.getElementById('mic-icon');
        const uploadTopicBtn = document.getElementById('upload-topic-btn');

        const topicUploadStatus = document.getElementById('topic-upload-status');

        const guidanceContent = document.getElementById('guidance-content');
        const brainstormBtn = document.getElementById('brainstorm-btn');
        const submitErrorMessage = document.getElementById('submit-error-message');


        // --- API Configuration ---
        const API_KEY = atob("QVEuQWI4Uk42TGJYamR5LWQzOTFWdHRpQll1TDhqMm40WTY3eDN5M1VXNHM2eHZkcnd6bnc=");
        const API_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/models/";
        const MODEL_NAME = "gemini-flash-latest";
        const CHAT_MODEL_NAME = "gemini-flash-lite-latest";

        // --- State Variables ---
        let isListening = false;
        let recognition;
        let finalTranscript = '';
        let punctuationTimer;
        let isProcessingPunctuation = false;
        let topicImageBase64 = null;
        let currentEssayText = "";
        let currentFeedback = null;
        let chatHistory = [];
        let brainstormChatHistory = [];

        const lessons = {
            'general': { title: '通用批改', guidance: null, prompt_addition: '' },
            'lesson2': { 
                title: '第二堂: 審題模組-WWH羅盤', 
                guidance: '<strong>寫作前思考：</strong><ul class="list-disc list-inside mt-1"><li><strong>What:</strong> 這是一個關於什麼的故事？</li><li><strong>Why:</strong> 為什麼這件事對我重要？</li><li><strong>How:</strong> 我要透過哪個具體事件來呈現？</li></ul>',
                prompt_addition: '請聚焦分析文章是否緊扣題旨，並檢查作者是否能透過WWH的思考層次，清晰地闡述其核心故事與意義。'
            },
            'lesson3': { 
                title: '第三堂: 立意模組-立意三層次',
                guidance: '<strong>寫作前思考：</strong><ul class="list-disc list-inside mt-1"><li><strong>A層次 (現實):</strong> 故事的具體人、事、物是什麼？</li><li><strong>B層次 (心靈):</strong> 這件事帶給我什麼內心體悟或成長？</li><li><strong>C層次 (社會):</strong> 我能從中提煉出什麼可以與他人分享的道理？</li></ul>',
                prompt_addition: '請優先使用「立意三層次(A-B-C)」理論來評估本文的思想高度。分析文章是否成功從A層次的現實事件，提升到B層次的心靈體悟，甚至觸及C層次的社會關懷。'
            },
            'lesson4': { 
                title: '第四堂: 結構模組-五段式結構',
                guidance: '<strong>寫作前規劃：</strong>請先擬定五段式大綱，確保文章結構完整。<br><strong>段落提醒：</strong>每個段落記得要包含「主題句」、「舉例說明」、「結論句」。',
                prompt_addition: '請重點檢視文章的「情境破題五段式結構」是否完整、段落安排是否精當。同時，請抽查核心段落是否具備「段落三要素」（主題句、舉例說明、結論句）。'
            },
            'lesson6': { 
                title: '第六堂: 情境開頭法',
                guidance: '<strong>開頭公式：</strong><ul class="list-disc list-inside mt-1"><li><strong>感官切入：</strong>用一個具體的視覺、聽覺或動作開場。</li><li><strong>情境描寫：</strong>用2-3句話將場景描寫得更完整。</li><li><strong>點明主旨：</strong>在段末有力地提出你的核心觀點。</li></ul>',
                prompt_addition: '請特別針對第一段進行點評，分析其「情境開頭法」是否成功。檢查開頭是否包含「感官切入」、「情境描寫」，並在段末清晰地「點明主旨」。'
            },
            'lesson7': { 
                title: '第七堂: 豹尾之勁-首尾呼應',
                guidance: '<strong>結尾技巧：</strong><ul class="list-disc list-inside mt-1"><li><strong>情境呼應：</strong>在結尾再次描寫開頭的場景或物件，並賦予新意義。</li><li><strong>觀點呼應：</strong>在結尾用不同語句，再次強調並昇華開頭的核心觀點。</li></ul>',
                prompt_addition: '請重點分析文章的「首尾呼應」做得如何。判斷結尾是採用「情境呼應」還是「觀點呼應」，並評價其效果是否讓文章結構更完整、主題更突出。'

            'lesson8': { 
                title: '第八堂: 文字的顯微鏡-細節描寫',

                prompt_addition: '請化身為「文字的顯微鏡」，細膩檢視文章中的細節描寫。找出文中的「形容詞懶人包」，並針對這些地方提出運用「五感摹寫」的具體修改建議，引導學生做到 Show, Don\'t Tell。'

                prompt_addition: '請重點關注文章中「修辭三寶」（譬喻、轉化、映襯）的運用。找出作者使用的修辭，並評價其是否用得精準、能為意義服務，而非僅為華麗而堆砌。'
            },
            'lesson10': { 
                title: '第十堂: 我想開設一家這樣的店',
                guidance: '<strong>題目引導：</strong>這是一道結合「圖文資訊」的傳統題。請先閱讀圖片中的四種店家想法，觸發靈感。你的文章需要具體寫下：想開什麼店？為什麼開？店的樣貌？',
                prompt_addition: '此為「我想開設一家這樣的店」的專題寫作。批改時請注意，除了基本評分標準外，也要評估學生是否能從A(現實樣貌)、B(心靈渴望)到C(社會價值)層次，深入闡述開店的理念與意義。'
            },
             'lesson14': { 
                title: '第十四堂: 情報分析學(上)-圖表與圖像',
                guidance: '<strong>分析三部曲：</strong><ul class="list-disc list-inside mt-1"><li><strong>看懂：</strong>客觀描述你看到了什麼資訊？</li><li><strong>找出：</strong>數據有什麼關鍵特徵 (最高/最低/趨勢)？圖像象徵什麼？</li><li><strong>詮釋：</strong>為你找到的特徵，提出一個合理的「為什麼」。</li></ul>',
                prompt_addition: '此為任務型寫作練習。請優先檢查學生是否完成「詮釋資訊」的核心任務。分析學生對圖表/圖像的詮釋是否合理，以及個人經驗的連結是否能有效支持其觀點。'
            },
            'lesson16': { 
                title: '第十六堂: 核心寫作-倉鼠題',
                guidance: '<strong>題目任務：</strong><ol class="list-decimal list-inside mt-1"><li>從「盲目、耽溺、選擇、冒險、自由、牢籠」六個詞彙中擇一。</li><li>說明你選的詞彙和「倉鼠在滾輪上跑」的圖一有何關聯。</li><li>結合個人經驗或觀察，寫下你的感受與想法。</li></ol>',
                prompt_addition: '此為「倉鼠題」的專題寫作。請重點批改學生是否完成所有任務指令：1. 是否明確做出選擇。 2. 是否清晰連結詞彙與圖像。 3. 個人經驗的闡述是否能深化主題。結構上，請檢視是否符合「詮釋資訊 -> 連結經驗 -> 綜合思辨」的任務型寫作架構。'
            },

        // --- Speech Recognition Setup ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'cmn-Hant-TW';

            recognition.onstart = () => {
                isListening = true;
                voiceStatusText.textContent = '聆聽中...';
                voiceInputBtn.classList.add('pulse', 'bg-red-500', 'text-white', 'dark:bg-red-500');

            recognition.onend = () => {
                isListening = false;
                voiceStatusText.textContent = '語音輸入';
                voiceInputBtn.classList.remove('pulse', 'bg-red-500', 'text-white', 'dark:bg-red-500');
                micIcon.classList.remove('text-white');
                processTranscript();
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                clearTimeout(punctuationTimer);
                punctuationTimer = setTimeout(processTranscript, 1500);
            };
            
            recognition.onerror = (event) => {
                console.error('Speech recognition error', event.error);
                if (event.error === 'not-allowed') {
                    // Use a custom modal or a less intrusive notification in a real app
                    alert('請允許瀏覽器使用麥克風才能啟用此功能。');
                    voiceInputBtn.disabled = true;
                }
            };

        } else {
            console.warn('Speech Recognition not supported in this browser.');
            voiceInputBtn.disabled = true;
            voiceStatusText.textContent = '瀏覽器不支援';
        }

        // --- Event Listeners ---
        document.addEventListener('DOMContentLoaded', loadFromLocalStorage);
        lessonSelector.addEventListener('change', handleLessonSelect);
        brainstormBtn.addEventListener('click', toggleBrainstormModal);
        essayInput.addEventListener('input', () => {
            saveToLocalStorage();
            updateWordCount();
        });
        topicInput.addEventListener('input', saveToLocalStorage);
        submitBtn.addEventListener('click', handleSubmit);
        if (voiceInputBtn) {
            voiceInputBtn.addEventListener('click', toggleVoiceInput);

        function handleLessonSelect() {
            const selectedLesson = lessonSelector.value;
            if (selectedLesson && lessons[selectedLesson] && lessons[selectedLesson].guidance) {
                guidanceContent.innerHTML = lessons[selectedLesson].guidance;
                guidanceSection.classList.remove('hidden');
            } else {

            // Auto-fill topic for specific lessons

                 topicInput.value = "我想開設一家這樣的店";

                 topicInput.value = "倉鼠題思辨";

                 topicInput.value = "罹癌少女的選擇";
            }

        }

        function updateWordCount() {
            wordCount.textContent = `${essayInput.value.length} 字`;
        }

        function saveToLocalStorage() {
            const dataToSave = {
                essay: essayInput.value,
                topic: topicInput.value,
                topicImg: topicImageBase64,
                lesson: lessonSelector.value
            };
            localStorage.setItem('savedEssayData', JSON.stringify(dataToSave));
        }

        function loadFromLocalStorage() {
            const savedData = localStorage.getItem('savedEssayData');
            if (savedData) {
                const parsedData = JSON.parse(savedData);
                essayInput.value = parsedData.essay || '';
                topicInput.value = parsedData.topic || '';
                if (parsedData.lesson) {
                    lessonSelector.value = parsedData.lesson;
                    handleLessonSelect();
                }
                if (parsedData.topicImg) {
                    topicImageBase64 = parsedData.topicImg;
                    topicPreviewImg.src = `data:image/jpeg;base64,${topicImageBase64}`;

        async function handleTopicFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            topicUploadStatus.textContent = `檔案「${file.name}」辨識中...`;
            uploadTopicBtn.disabled = true;
            
            try {
                const base64Data = await fileToBase64(file);
                topicImageBase64 = base64Data;
                topicPreviewImg.src = `data:image/jpeg;base64,${base64Data}`;
                topicPreviewContainer.classList.remove('hidden');

                const prompt = "請辨識並抽取出這張圖片中的所有繁體中文文字，這是一份作文題目。請盡力還原換行與段落結構，並以純文字格式回傳。";
                const text = await callGeminiVision(base64Data, prompt);
                topicInput.value = text;
                topicUploadStatus.textContent = `題目辨識完成！`;
                saveToLocalStorage();
            } catch (error) {
                console.error('Topic OCR Error:', error);
                topicUploadStatus.textContent = '題目辨識失敗，請重試。';
                topicImageBase64 = null;
                topicPreviewContainer.classList.add('hidden');
            } finally {
                uploadTopicBtn.disabled = false;
                topicFileUpload.value = ''; // Reset file input
                setTimeout(() => { topicUploadStatus.textContent = ''; }, 3000);
            }
        }
        
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }
        
        async function callGeminiVision(base64ImageData, visionPrompt) {
            const apiUrl = `${API_BASE_URL}${MODEL_NAME}:generateContent?key=${API_KEY}`;
            const payload = { contents: [{ parts: [{ text: visionPrompt }, { inlineData: { mimeType: "image/jpeg", data: base64ImageData } }] }] };
            const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!response.ok) throw new Error(`API call failed with status: ${response.status}`);
            const result = await response.json();
            if (result.candidates && result.candidates[0].content && result.candidates[0].content.parts[0]) {
                return result.candidates[0].content.parts[0].text;
            }
            return "AI無法從圖片中辨識出文字。";
        }


        function toggleVoiceInput() {
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        async function processTranscript() {
            if (!finalTranscript || isProcessingPunctuation) return;
            
            const textToProcess = finalTranscript;
            finalTranscript = '';
            isProcessingPunctuation = true;

            const indicator = ' ✍️ AI 處理中...';
            essayInput.value += indicator;
            essayInput.scrollTop = essayInput.scrollHeight;

            try {
                const punctuatedText = await addPunctuation(textToProcess);
                essayInput.value = essayInput.value.slice(0, -indicator.length); // Remove indicator
                const currentText = essayInput.value;
                const separator = currentText.length > 0 && !currentText.endsWith('\n') ? ' ' : '';
                essayInput.value += separator + punctuatedText;
            } catch (error) {
                console.error("Punctuation error:", error);
                essayInput.value = essayInput.value.slice(0, -indicator.length); // Remove indicator
                essayInput.value += ' ' + textToProcess; // Fallback
            } finally {
                essayInput.dispatchEvent(new Event('input'));
                isProcessingPunctuation = false;
            }
        }

        async function addPunctuation(text) {
            const apiUrl = `${API_BASE_URL}${MODEL_NAME}:generateContent?key=${API_KEY}`;
            const prompt = `請為以下這段聽寫的繁體中文文字加上適當的標點符號，使其成為通順的句子。請直接回傳加上標點後的文字，不要包含任何額外的說明或標籤。\n\n文字如下：\n"${text}"`;
            
            const payload = { contents: [{ parts: [{ text: prompt }] }] };
            const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!response.ok) throw new Error(`API call failed with status: ${response.status}`);
            const result = await response.json();
            if (result.candidates && result.candidates[0].content && result.candidates[0].content.parts[0]) {
                return result.candidates[0].content.parts[0].text.trim();
            }
            throw new Error("AI未能加上標點。");
        }

        async function getAIFeedback(essayText, topicText, topicImgBase64, lessonKey = 'general') {
            const apiUrl = `${API_BASE_URL}${MODEL_NAME}:generateContent?key=${API_KEY}`;
            
            let lessonInstructions = '';
            if (lessonKey && lessons[lessonKey] && lessons[lessonKey].prompt_addition) {

            }

            const prompt = `# 指令：你是一位資深的台灣國中國文老師(學思達教學法)，你的任務是依據最新的114年會考標準與指定的課堂學習重點，批改學生的作文。請遵循「關鍵指導」批改模式。
${lessonInstructions}
## 評分哲學：
你的評分應更具彈性與鼓勵性。**請優先依據「114年國中會考官方評分標準與各級分樣卷特徵」來評定基本級分。** 在此基礎上，再引用老師的「講義核心概念」(已包含在下方的教學核心與課堂學習重點中)作為拔尖的建議，引導學生從「符合標準」邁向「優秀」。
